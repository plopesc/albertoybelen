name: Pages de pruebas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-tests
  cancel-in-progress: false

jobs:
  deploy:
    # Ausente/false por defecto. Solo el propietario puede habilitarlo tras aprobar.
    if: github.ref == 'refs/heads/main' && vars.PAGES_TEST_DEPLOY_ENABLED == 'true'
    name: Publicar frontend de pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el código de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Comprobar el frontend antes de publicar
        run: |
          for module in frontend/js/*.js; do node --check "$module"; done
          npm test
      - name: Consultar Pages sin activar el servicio
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: 'false'
      - name: Empaquetar solo frontend como raíz
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/
          retention-days: 1
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
