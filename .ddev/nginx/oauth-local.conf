# Local OAuth backend only. Never log code/state/private invitation requests.
location = /invite {
    if ($host != albertoybelen.ddev.site) { return 404; }
    set $oauth_secure $https;
    if ($fcgi_https = on) { set $oauth_secure on; }
    if ($oauth_secure != on) { return 400; }
    access_log off;
    error_log /dev/null;
    proxy_pass https://127.0.0.1:8790;
    # Wrangler uses a self-signed development certificate, loopback only.
    proxy_ssl_verify off;
    proxy_set_header Host albertoybelen.ddev.site;
    proxy_set_header X-Forwarded-Proto https;
}
